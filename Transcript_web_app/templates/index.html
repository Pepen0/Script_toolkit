<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Transcript Extractor</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe3ee;
      --accent: #1f6fb8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .wrap {
      max-width: 780px;
      margin: 28px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }
    .muted { color: var(--muted); margin: 0 0 14px; }
    label {
      display: block;
      font-size: 14px;
      margin-top: 12px;
    }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      background: #fff;
    }
    textarea { min-height: 76px; resize: vertical; }
    .dropzone {
      margin-top: 12px;
      border: 1px dashed #9bb4cf;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      background: #fafcff;
    }
    .dropzone.drag {
      border-color: var(--accent);
      color: var(--accent);
      background: #f3f8fe;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .row input[type="checkbox"] {
      width: auto;
      margin: 0;
      padding: 0;
    }
    details {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfdff;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px 12px;
      margin-top: 10px;
    }
    .outputs {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(80px, 1fr));
      gap: 8px;
    }
    button {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: progress; }
    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      min-height: 20px;
    }
    .status.error { color: #b42318; }
    .status.ok { color: #0f766e; }
    .progress-wrap {
      margin-top: 10px;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e7edf5;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #d8e0ea;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2f7ec5 0%, #5b9ddd 100%);
      transition: width 0.4s ease;
    }
    .progress-note {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Local Transcript Extractor</h1>
      <p class="muted">Drop one video and download subtitle/text artifacts as a ZIP.</p>

      <form id="transcribe-form" method="post" action="/transcribe" enctype="multipart/form-data">
        <div id="dropzone" class="dropzone">Drop video here</div>

        <label>
          Video file
          <input id="file" type="file" name="file" accept=".mp4,.mkv,.mov,.m4v,.avi,.mpg,.mpeg" required />
        </label>

        <details>
          <summary>Advanced settings</summary>

          <div class="grid">
            <label>Model
              <select name="model">
                <option>tiny</option>
                <option>base</option>
                <option>small</option>
                <option>medium</option>
                <option selected>large-v3</option>
              </select>
            </label>
            <label>Device
              <select name="device">
                <option selected>auto</option>
                <option>cpu</option>
                <option>cuda</option>
              </select>
            </label>
            <label>Compute type
              <input name="compute_type" value="int8" />
            </label>
            <label>Language (optional)
              <input name="language" placeholder="e.g. en" />
            </label>
            <label>Beam size
              <input type="number" min="1" name="beam_size" value="5" />
            </label>
            <label>Temperature
              <input type="number" name="temperature" value="0.0" min="0" max="1" step="0.1" />
            </label>
            <label>Subtitle chunk size
              <input type="number" min="0" name="subtitle_chunk_size" value="3" />
            </label>
            <label>Subtitle chunk mode
              <select name="subtitle_chunk_mode">
                <option value="fixed">fixed</option>
                <option selected value="adaptive">adaptive</option>
              </select>
            </label>
          </div>

          <label>Initial prompt (optional)
            <textarea name="initial_prompt" placeholder="Optional domain context"></textarea>
          </label>

          <div class="grid">
            <label class="row"><input type="checkbox" name="vad" value="true" />Enable VAD filter</label>
            <label class="row"><input type="checkbox" name="no_condition_on_previous" value="true" />Disable conditioning on previous text</label>
            <label class="row"><input type="checkbox" name="word_timestamps" value="true" />Emit word timestamps</label>
          </div>
        </details>

        <label style="margin-top:14px;"><strong>Output formats</strong></label>
        <div class="outputs">
          <label class="row"><input type="checkbox" name="out_txt" value="true" />TXT</label>
          <label class="row"><input type="checkbox" name="out_srt" value="true" checked />SRT</label>
          <label class="row"><input type="checkbox" name="out_vtt" value="true" />VTT</label>
          <label class="row"><input type="checkbox" name="out_json" value="true" />JSON</label>
        </div>

        <button id="submit" type="submit">Transcribe and download ZIP</button>
        <div id="progress-wrap" class="progress-wrap">
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
          <div id="progress-note" class="progress-note"></div>
        </div>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('transcribe-form');
    const submitBtn = document.getElementById('submit');
    const status = document.getElementById('status');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file');
    const progressWrap = document.getElementById('progress-wrap');
    const progressBar = document.getElementById('progress-bar');
    const progressNote = document.getElementById('progress-note');

    const funnyNotes = [
      'Just decoding. Nothing suspicious is going on.',
      'Teaching subtitles to keep up with your video.',
      'Listening very carefully to every word.',
      'Negotiating with punctuation marks.',
      'Converting vibes into timestamps.',
      'Warming up the transcript wizard.',
      'Aligning captions with the space-time continuum.'
    ];

    let progressTimer = null;
    let noteTimer = null;
    let progressValue = 0;

    function startProgressUi() {
      progressValue = 3;
      progressBar.style.width = `${progressValue}%`;
      progressWrap.classList.add('show');
      progressNote.textContent = funnyNotes[Math.floor(Math.random() * funnyNotes.length)];

      progressTimer = setInterval(() => {
        if (progressValue < 92) {
          const step = Math.random() * 4;
          progressValue = Math.min(92, progressValue + step);
          progressBar.style.width = `${progressValue.toFixed(1)}%`;
        }
      }, 700);

      noteTimer = setInterval(() => {
        progressNote.textContent = funnyNotes[Math.floor(Math.random() * funnyNotes.length)];
      }, 2600);
    }

    function stopProgressUi(success) {
      if (progressTimer) clearInterval(progressTimer);
      if (noteTimer) clearInterval(noteTimer);
      progressTimer = null;
      noteTimer = null;

      if (success) {
        progressBar.style.width = '100%';
        progressNote.textContent = 'Packaging your files...';
        setTimeout(() => {
          progressWrap.classList.remove('show');
          progressBar.style.width = '0%';
          progressNote.textContent = '';
        }, 700);
      } else {
        progressWrap.classList.remove('show');
        progressBar.style.width = '0%';
        progressNote.textContent = '';
      }
    }

    async function checkServerHealth() {
      try {
        const res = await fetch('/health', { method: 'GET', cache: 'no-store' });
        return res.ok;
      } catch (_) {
        return false;
      }
    }

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) fileInput.files = files;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      status.className = 'status';
      status.textContent = 'Processing locally. Please wait...';
      startProgressUi();
      try {
        const healthy = await checkServerHealth();
        if (!healthy) {
          throw new Error(
            'The local app service is not reachable. Close and reopen the app, then try again.'
          );
        }

        const data = new FormData(form);
        const res = await fetch('/transcribe', { method: 'POST', body: data });
        if (!res.ok) {
          let message = 'Transcription request failed.';
          const contentType = res.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const payload = await res.json();
            message = payload.detail || message;
          } else {
            const text = await res.text();
            if (text) message = text;
          }
          throw new Error(message);
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        const cd = res.headers.get('Content-Disposition') || '';
        const match = cd.match(/filename=\"?([^\";]+)\"?/);
        a.href = url;
        a.download = match ? match[1] : 'transcript_artifacts.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        stopProgressUi(true);
        status.className = 'status ok';
        status.textContent = 'Done. Your ZIP download started.';
      } catch (err) {
        stopProgressUi(false);
        status.className = 'status error';
        const raw = (err && err.message) ? err.message : 'Unknown error';
        const friendly = raw.toLowerCase().includes('failed to fetch')
          ? 'Connection to local app was interrupted. Keep this app open and try again.'
          : raw;
        status.textContent = `Error: ${friendly}`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
